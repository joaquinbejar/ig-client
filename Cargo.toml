[package]
name = "ig-client"
version = "0.12.3"
edition = "2024"
authors = ["Joaquin Bejar <jb@taunais.com>"]
description = "This crate provides a client for the IG Markets API"
license = "MIT"
readme = "README.md"
repository = "https://github.com/joaquinbejar/ig-client"
homepage = "https://github.com/joaquinbejar/ig-client"
keywords = ["finance", "ohlc", "tick", "trading"]
categories = ["finance", "data-structures"]

include = [
    "benches/**/*",
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "examples/**/*",
    "tests/**/*",
    "Makefile",
    "rust-toolchain.toml",
    "Draws/**/*",
    "Docker/**/*",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Both heavy legs are on by default, so existing users are unaffected.
default = ["persistence", "streaming"]
# PostgreSQL persistence (`ig_client::storage`) via sqlx.
persistence = ["dep:sqlx"]
# Real-time Lightstreamer streaming (`StreamerClient`, `DynamicMarketStreamer`).
# `lightstreamer-rs` is GPL-3.0-only, so a permissively-licensed consumer that
# only needs the REST path can turn this off and keep it out of its graph.
streaming = ["dep:lightstreamer-rs"]

[dependencies]
tokio = { workspace = true}
chrono = { workspace = true}
tracing = { workspace = true}
tracing-subscriber = { workspace = true}
serde = { workspace = true}
serde_json = { workspace = true}
reqwest ={ workspace = true}
sqlx = { workspace = true, optional = true }
async-trait = { workspace = true}
regex = { workspace = true}
dotenv = { workspace = true}
lightstreamer-rs = { workspace = true, optional = true }
lazy_static = { workspace = true}
nanoid = { workspace = true}
pretty-simple-display = { workspace = true}
governor = { workspace = true}
prettytable-rs = { workspace = true}
futures = { workspace = true}
thiserror = { workspace = true}

[dev-dependencies]
wiremock = "0.6"
criterion = { workspace = true }

[[test]]
name = "unit_tests"
path = "tests/unit/mod.rs"

[[test]]
name = "integration_tests"
path = "tests/integration/mod.rs"

[lib]
name = "ig_client"
path = "src/lib.rs"

[[bench]]
name = "benchmarks"
harness = false
path = "benches/benchmarks.rs"

[workspace]
members = [
    "examples/chart",
    "examples/costs",
    "examples/market",
    "examples/orders",
    "examples/trade",
    "examples/prices",
    "examples/transactions",
    "examples/positions",
    "examples/other",
    "examples/sentiment",
    "examples/simples",
    "examples/streaming",
    "examples/watchlist",
]

[workspace.dependencies]
ig-client=  { path = "." }
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "signal"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["json"] }
criterion = "0.8"
sqlx = { version = "0.9", features = [ "postgres","macros","chrono","runtime-tokio","tls-native-tls"]}
async-trait = "0.1"
regex = "1.12"
dotenv = "0.15"
lightstreamer-rs = "0.3.3"
lazy_static = "1.5"
nanoid = "0.5"
pretty-simple-display = "0.1"
governor = "0.10"
prettytable-rs = "0.10"
futures = "0.3"
thiserror = "2"
